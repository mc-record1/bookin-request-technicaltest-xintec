spring:
  application:
    name: bookingrequests-api

  datasource:
    url: jdbc:mysql://localhost:3306/bd_booking_requests
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.MySQLDialect